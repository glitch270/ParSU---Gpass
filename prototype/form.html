<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | PARSU-GPass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">PARSU-GPass</a>
    <a href="#">Log in</a>
  </header>

  <main class="content content-center">
    <div class="page-head">
      <div>
        <h1>Register</h1>
        <p class="subtitle">Create an account to apply for a gate pass</p>
      </div>
    </div>

    <form class="card form-card" action="#" method="post">
      <div class="form-grid">
          <div class="field">
            <label for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" name="email" maxlength="150" placeholder="you@parsu.edu.ph" required>
          </div>
          <div class="field">
            <label for="password">Password <span class="req">*</span></label>
            <input type="password" id="password" name="password" minlength="8" placeholder="At least 8 characters" required>
          </div>
          <div class="field">
            <label for="confirm_password">Confirm password <span class="req">*</span></label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="8" placeholder="Repeat password" required>
            <span class="hint">Form only, not saved in the database</span>
          </div>
          <div class="field has-error">
            <label for="applicant_type">Applicant type <span class="req">*</span></label>
            <select id="applicant_type" name="applicant_type" aria-describedby="type-error" aria-invalid="true" required>
              <option value="">Choose one</option>
              <option value="student">Student</option>
              <option value="employee">Employee</option>
            </select>
            <p class="error" id="type-error">Please choose an applicant type.</p>
          </div>
          <div class="field">
            <label for="school_id">School ID <span class="req">*</span></label>
            <input type="text" id="school_id" name="school_id" maxlength="50" placeholder="e.g. STUD-2024-0012" required>
          </div>
          <div class="field">
            <label for="first_name">First name <span class="req">*</span></label>
            <input type="text" id="first_name" name="first_name" maxlength="100" placeholder="" required>
          </div>
          <div class="field">
            <label for="middle_name">Middle name</label>
            <input type="text" id="middle_name" name="middle_name" maxlength="100" placeholder="">
          </div>
          <div class="field">
            <label for="last_name">Last name <span class="req">*</span></label>
            <input type="text" id="last_name" name="last_name" maxlength="100" placeholder="" required>
          </div>
          <div class="field">
            <label for="suffix">Suffix</label>
            <input type="text" id="suffix" name="suffix" maxlength="20" placeholder="Jr., III">
          </div>
          <div class="field">
            <label for="contact_number">Contact number <span class="req">*</span></label>
            <input type="tel" id="contact_number" name="contact_number" minlength="7" maxlength="30" placeholder="09123456789" required>
          </div>
          <div class="field">
            <label for="department">Department <span class="req">*</span></label>
            <input type="text" id="department" name="department" maxlength="150" placeholder="" required>
          </div>
          <div class="field">
            <label for="course_year_section">Course, year and section</label>
            <input type="text" id="course_year_section" name="course_year_section" maxlength="150" placeholder="Students only, e.g. BSIT - 4A">
          </div>
          <div class="field">
            <label for="license_number">Driver&rsquo;s license number</label>
            <input type="text" id="license_number" name="license_number" maxlength="50" placeholder="">
          </div>
      </div>

      <p class="hint"><span class="req">*</span> Required field</p>

      <div class="form-actions">
        <button class="btn" type="submit">Register</button>
        <a class="btn btn-secondary" href="#">Cancel</a>
      </div>
    </form>
  </main>
</body>
</html>
